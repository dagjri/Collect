<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLLECT.</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--ink:#1f1f1f;--sub:#777;--line:#e8e8e6;--soft:#f1f1ef;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1c1c1c;--ink:#eee;--sub:#9a9a9a;--line:#2c2c2c;--soft:#242424;--danger:#ff8a80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.55;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hl{display:flex;align-items:center;gap:8px;min-width:0}
#title{margin:0;font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#title.brand{letter-spacing:.18em}
#back{min-height:38px;width:38px;padding:0;font-size:22px;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg[hidden]{display:none}
.seg button{min-height:34px;border:0;border-radius:0;padding:0 12px;font-size:13px;color:var(--sub);background:transparent}
.seg button.on{background:var(--ink);color:var(--bg)}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:4px 0 14px}
h3{font-size:13px;color:var(--sub);margin:22px 0 8px;font-weight:600;letter-spacing:.08em}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 4px}
button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.dng{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.bar{display:flex;gap:8px;margin-bottom:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:-4px -16px 12px;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:0;background:transparent;color:var(--sub);min-height:44px;padding:0 12px;box-shadow:inset 0 -2px 0 transparent}
.tab.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;min-height:34px;padding:0 14px;border-radius:999px;font-size:14px;color:var(--sub)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:2px 0 10px;gap:8px}
.meta select{width:auto;min-height:34px;padding:2px 8px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ct b{overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.bd{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--sub);white-space:nowrap}
.bd.k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;color:var(--sub);padding:44px 16px;border:1px dashed var(--line);border-radius:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-bottom:10px}
.box.accent{border-color:var(--ink)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li b{font-weight:600}
label.sw{display:flex;align-items:center;gap:12px;padding:14px 0;margin:0;color:var(--ink);font-size:16px;border-bottom:1px solid var(--line);cursor:pointer}
label.sw:last-child{border-bottom:0}
label.sw input{width:24px;min-height:24px;height:24px;flex:none;padding:0}
.note{font-size:13px;color:var(--sub);background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
#fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:28px;padding:0;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:18px}}
.dl{display:grid;grid-template-columns:104px 1fr;gap:8px 10px;font-size:15px;margin:14px 0}
.dl dt{color:var(--sub);font-size:13px}.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.lines{background:var(--soft);border-radius:12px;padding:4px 14px;margin:6px 0 14px}
.lines div{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.lines div:last-child{border-bottom:0}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
details.more summary{cursor:pointer;color:var(--sub);min-height:44px;display:flex;align-items:center}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
