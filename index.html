<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLLECT.</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#1f1f1f;--sub:#7a7a7a;--line:#ebebeb;--soft:#f5f5f4;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#1d1d1d;--ink:#eee;--sub:#9a9a9a;--line:#2c2c2c;--soft:#242424;--danger:#ff8a80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.55;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hl{display:flex;align-items:center;gap:6px}
h1{margin:0;font-size:19px;letter-spacing:.18em}
#back{min-height:36px;padding:0 10px;border:0;background:var(--soft);font-size:18px}
#mode{min-height:34px;padding:0 12px;font-size:13px;border-radius:999px;color:var(--sub)}
#mode.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:6px 0 14px}
h3{font-size:13px;color:var(--sub);margin:24px 0 8px;font-weight:600}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:100px;resize:vertical}
button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.dng{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.bar{display:flex;gap:8px;margin-bottom:10px}
.addrow{width:100%;text-align:left;border:1px dashed var(--line);color:var(--sub);margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 14px;border-radius:999px;font-size:14px;color:var(--sub)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details{margin:2px 0 8px}
summary{cursor:pointer;color:var(--sub);font-size:14px;min-height:36px;display:flex;align-items:center}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:6px 0 10px;gap:6px}
.row2{display:flex;gap:6px;align-items:center}
.meta select{width:auto;min-height:34px;padding:2px 8px;font-size:13px}
.mini{min-height:34px;padding:0 10px;font-size:13px;color:var(--sub)}
.mini.on{background:var(--soft);color:var(--ink);font-weight:700}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--sub);font-size:11px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ct{min-width:0;flex:1}.ct b{display:block;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bd{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--sub)}
.bd.k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rowi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.rowi b{font-weight:600;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--sub);padding:44px 16px;border:1px dashed var(--line);border-radius:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:10px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.note{font-size:13px;color:var(--sub);background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.ptitle{font-size:24px;font-weight:700;border:0;background:transparent;padding:0;min-height:52px;margin-bottom:6px}
.ptitle:focus{outline:0;background:var(--soft);padding:0 8px;border-radius:8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:transparent;min-height:56px;font-size:12px;color:var(--sub);padding:0 2px}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 2px 0 var(--ink)}
#fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:28px;padding:0;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:18px}}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pr{display:grid;grid-template-columns:104px 1fr;align-items:start;border-bottom:1px solid var(--line);padding:2px 0}
.pl{font-size:13px;color:var(--sub);padding-top:12px}
.pv input,.pv select,.pv textarea{border:0;background:transparent;border-radius:8px;padding:8px;min-height:42px}
.pv input:focus,.pv select:focus,.pv textarea:focus{outline:0;background:var(--soft)}
.dl{display:grid;grid-template-columns:104px 1fr;gap:8px 10px;font-size:15px;margin:12px 0}
.dl dt{color:var(--sub);font-size:13px}.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hl"><button id="back" data-act="go" data-p="home" hidden>‹</button><h1 id="appname">COLLECT.</h1></div>
  <button id="mode" data-act="mode">編集モード</button>
</header>
<main id="main"></main>
<button id="fab" data-act="new" aria-label="新規追加">＋</button>
<nav id="nav">
  <button data-act="go" data-p="home">ホーム</button>
  <button data-act="go" data-p="owned">所持</button>
  <button data-act="go" data-p="wanted">求め</button>
  <button data-act="go" data-p="trade">交換</button>
  <button data-act="go" data-p="settings">設定</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
const APP='COLLECT.';
const KEY='collect_v1',PREV='collect_v1_prev',PK='collect_prefs';
const CATS=['CD','DVD/Blu-ray','グッズ','写真','トレカ','雑誌','書籍','ライブ映像','TV録画','その他'];
const TR=['','交換可','相談中','取り置き','成立','キャンセル','交換不可'];
const COND=['','新品・未開封','美品','良好','傷あり','難あり'];
const WANT=['','探し中','取引中'];
const PRIO=['','高','中','低'];
const FIELDS=['title','status','category','sub','artist','member','release','bdate','edition','format','qty','condition','pdate','price','store','notes','contents','image','tags','listId','trade','want','prio'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const okUrl=u=>/^https?:\/\//i.test(u||'');
const uniq=a=>Array.from(new Set(a.filter(Boolean)));
document.title=APP;$('#appname').textContent=APP;

let P={mode:'edit',view:'cards',seen:false};
try{Object.assign(P,JSON.parse(localStorage.getItem(PK))||{})}catch(e){}
const saveP=()=>{try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}};
const canEdit=()=>P.mode==='edit';

function fixItem(x){
  const s=(k,n)=>String(x[k]==null?'':x[k]).slice(0,n||300);
  return{id:s('id',60)||uid(),title:s('title'),status:x.status==='wanted'?'wanted':'owned',category:s('category',60),sub:s('sub',60),artist:s('artist'),member:s('member'),release:s('release',20),bdate:s('bdate',20),edition:s('edition'),format:s('format'),qty:Math.max(0,parseInt(x.qty,10)||0),condition:s('condition',40),pdate:s('pdate',20),price:s('price',30),store:s('store'),notes:s('notes',3000),contents:s('contents',3000),image:okUrl(x.image)?s('image',1000):'',tags:(Array.isArray(x.tags)?x.tags:[]).map(t=>String(t).trim().slice(0,30)).filter(Boolean).slice(0,20),listId:s('listId',60),trade:TR.indexOf(x.trade)>=0?x.trade:'',want:WANT.indexOf(x.want)>=0?x.want:'',prio:PRIO.indexOf(x.prio)>=0?x.prio:'',added:Number(x.added)||Date.now()};
}
function norm(r){
  return{items:(Array.isArray(r.items)?r.items:[]).filter(x=>x&&typeof x==='object').map(fixItem),
    lists:(Array.isArray(r.lists)?r.lists:[]).filter(l=>l&&l.id&&l.name).map(l=>({id:String(l.id).slice(0,60),name:String(l.name).slice(0,40)})),
    cats:(Array.isArray(r.cats)?r.cats:[]).map(c=>String(c).slice(0,30)).filter(Boolean),
    notice:String(r.notice||'').slice(0,3000)};
}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.items))return norm(r)}catch(e){}return{items:[],lists:[],cats:[],notice:''}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('保存に失敗しました。端末の空き容量を確認してください');return false}}
const UI0={page:'home',q:'',cat:'',sub:'',year:'',artist:'',tag:'',trade:'',want:'',prio:'',sort:'added',fresh:''};
let ui=Object.assign({},UI0);
let importMode='merge';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
const allCats=()=>CATS.concat(S.cats.filter(c=>CATS.indexOf(c)<0));
const yearOf=i=>(i.release||i.bdate||'').slice(0,4);
function go(p){ui=Object.assign({},UI0,{page:p,sort:ui.sort});render();window.scrollTo(0,0)}

function baseItems(){
  const p=ui.page;
  if(p==='owned')return S.items.filter(i=>i.status==='owned');
  if(p==='wanted')return S.items.filter(i=>i.status==='wanted');
  if(p==='trade')return S.items.filter(i=>i.trade);
  if(p.indexOf('list:')===0){const id=p.slice(5);return S.items.filter(i=>i.listId===id)}
  return[];
}
function match(it){
  const q=ui.q.trim().toLowerCase();
  if(q){const h=[it.title,it.artist,it.member,it.edition,it.format,it.store,it.notes,it.contents,it.category,it.sub].concat(it.tags).join(' ').toLowerCase();
    if(!q.split(/\s+/).every(w=>h.indexOf(w)>=0))return false}
  if(ui.cat&&it.category!==ui.cat)return false;
  if(ui.sub&&it.sub!==ui.sub)return false;
  if(ui.year&&yearOf(it)!==ui.year)return false;
  if(ui.artist&&it.artist!==ui.artist)return false;
  if(ui.tag&&it.tags.indexOf(ui.tag)<0)return false;
  if(ui.trade&&it.trade!==ui.trade)return false;
  if(ui.want&&it.want!==ui.want)return false;
  if(ui.prio&&it.prio!==ui.prio)return false;
  return true;
}
function sorter(){
  const c=(a,b)=>String(a).localeCompare(String(b),'ja');
  if(ui.sort==='title')return(a,b)=>c(a.title,b.title);
  if(ui.sort==='release')return(a,b)=>c(b.release||b.bdate,a.release||a.bdate);
  if(ui.sort==='artist')return(a,b)=>c(a.artist,b.artist)||c(a.title,b.title);
  if(ui.sort==='prio'){const o={'高':0,'中':1,'低':2,'':3};return(a,b)=>o[a.prio]-o[b.prio]}
  return(a,b)=>b.added-a.added;
}

function render(){
  if(ui.page.indexOf('list:')===0&&!S.lists.some(l=>'list:'+l.id===ui.page))ui.page='home';
  const p=ui.page,isList=p.indexOf('list:')===0,navKey=isList?'home':p;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===navKey));
  $('#back').hidden=!isList;
  $('#mode').textContent=canEdit()?'編集モード':'閲覧モード';
  $('#mode').classList.toggle('on',canEdit());
  $('#fab').style.display=(canEdit()&&(p==='owned'||p==='wanted'||isList))?'block':'none';
  const m=$('#main');
  if(p==='home')m.innerHTML=viewHome();
  else if(p==='settings')m.innerHTML=viewSettings();
  else{m.innerHTML=viewItems();renderCards()}
}

function homeRow(p,name,n){return`<div class="li" data-act="go" data-p="${esc(p)}"><span><b>${esc(name)}</b></span><span class="sub">${n}件 ›</span></div>`}
function viewHome(){
  const o=S.items.filter(i=>i.status==='owned').length,w=S.items.length-o,t=S.items.filter(i=>i.trade).length;
  const lists=S.lists.map(l=>homeRow('list:'+l.id,l.name,S.items.filter(i=>i.listId===l.id).length)).join('');
  return`<h2>ホーム</h2>
  <div class="box"><div class="li" data-act="notice"><span><b>必読</b></span><span class="sub">›</span></div></div>
  <h3>まとめて見る</h3>
  <div class="box">${homeRow('owned','所持リスト',o)}${homeRow('wanted','求めリスト',w)}${homeRow('trade','交換管理',t)}</div>
  <h3>マイリスト</h3>
  <div class="box">${lists||'<div class="sub" style="padding:14px 0">まだありません。'+(canEdit()?'下の入力欄から作れます。':'')+'</div>'}</div>
  ${canEdit()?`<div class="bar"><input id="newlist" maxlength="40" placeholder="新しいリスト名（例：ライブ別）"><button class="pri" data-act="addlist" style="flex:none">作る</button></div>`:''}
  <div style="margin-top:18px"><button data-act="guide" data-i="0">使い方ガイドを見る</button></div>`;
}

function chips(arr,cur,key,all){
  return`<div class="chips"><button class="chip${cur?'':' on'}" data-act="chip" data-k="${key}" data-v="">${all}</button>${arr.map(x=>`<button class="chip${x===cur?' on':''}" data-act="chip" data-k="${key}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
}
function viewItems(){
  const p=ui.page,isList=p.indexOf('list:')===0,base=baseItems();
  const lst=isList?S.lists.find(l=>'list:'+l.id===p):null;
  let head;
  if(isList)head=canEdit()?`<input class="ptitle" id="lname" maxlength="40" value="${esc(lst.name)}">`:`<h2>${esc(lst.name)}</h2>`;
  else head=`<h2>${p==='owned'?'所持リスト':p==='wanted'?'求めリスト':'交換管理'}</h2>`+(p==='trade'?'<div class="note">「交換の状態」を設定したアイテムがここに集まります。</div>':'');
  const cats=uniq(base.map(i=>i.category)),subs=ui.cat?uniq(base.filter(i=>i.category===ui.cat).map(i=>i.sub)):[],years=uniq(base.map(yearOf)).sort();
  const arts=uniq(base.map(i=>i.artist)).sort(),tags=uniq([].concat.apply([],base.map(i=>i.tags))).sort();
  const opt=(arr,v,ph)=>`<option value="">${ph}</option>`+arr.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
  const open=(ui.artist||ui.tag||ui.trade||ui.want||ui.prio)?' open':'';
  return head+
   (canEdit()&&p!=='trade'?`<button class="addrow" data-act="new">＋ 新規</button>`:'')+
   `<div class="bar"><input id="q" type="search" placeholder="タイトル・グループ・メモなどで検索" value="${esc(ui.q)}"></div>`+
   (cats.length?chips(cats,ui.cat,'cat','すべて'):'')+(subs.length?chips(subs,ui.sub,'sub','すべて'):'')+(years.length>1?chips(years,ui.year,'year','全年'):'')+
   `<details${open}><summary>さらに絞り込み</summary><div class="filters">
    <select data-f="artist">${opt(arts,ui.artist,'グループ: すべて')}</select>
    <select data-f="tag">${opt(tags,ui.tag,'タグ: すべて')}</select>
    <select data-f="trade">${opt(TR.filter(Boolean),ui.trade,'交換: すべて')}</select>
    <select data-f="want">${opt(WANT.filter(Boolean),ui.want,'求め状態: すべて')}</select>
    <select data-f="prio">${opt(PRIO.filter(Boolean),ui.prio,'優先度: すべて')}</select>
    <button data-act="resetf">条件をリセット</button></div></details>`+
   `<div class="meta"><span id="res"></span><span class="row2">
    <button class="mini${P.view==='cards'?' on':''}" data-act="view" data-v="cards">カード</button>
    <button class="mini${P.view==='list'?' on':''}" data-act="view" data-v="list">一覧</button>
    <select data-f="sort">${[['added','追加が新しい順'],['title','タイトル順'],['release','発売日が新しい順'],['artist','グループ順'],['prio','優先度順']].map(a=>`<option value="${a[0]}"${ui.sort===a[0]?' selected':''}>${a[1]}</option>`).join('')}</select></span></div>
    <div id="cards"></div>`+
   (isList&&canEdit()?`<button class="dng" data-act="dellist" data-id="${esc(lst.id)}" style="width:100%;margin-top:24px">このリストを削除</button>`:'');
}
function renderCards(){
  const base=baseItems(),list=base.filter(match).sort(sorter());
  $('#res').textContent=list.length+'件';
  let h='';
  if(!list.length){
    h=base.length?'<div class="empty">条件に合うアイテムがありません。<br>検索や絞り込みを変えてみてください。</div>'
      :`<div class="empty">まだアイテムがありません。<br>${ui.page==='trade'?'アイテムの「交換の状態」を設定すると、ここに表示されます。':(canEdit()?'「＋ 新規」から最初の1件を追加しましょう。':'編集モードに切り替えると追加できます。')}</div>`;
  }else h=list.map(P.view==='list'?rowItem:card).join('');
  $('#cards').innerHTML=h;
}
function badges(it){
  const b=[];
  if(it.category)b.push(`<span class="bd">${esc(it.category)}${it.sub?' / '+esc(it.sub):''}</span>`);
  if(it.qty>1)b.push(`<span class="bd">×${it.qty}</span>`);
  if(it.status==='wanted'&&it.want)b.push(`<span class="bd">${esc(it.want)}</span>`);
  if(it.status==='wanted'&&it.prio)b.push(`<span class="bd k">優先度:${esc(it.prio)}</span>`);
  if(it.trade)b.push(`<span class="bd k">${esc(it.trade)}</span>`);
  return b.join('');
}
function card(it){
  const sub=[it.artist,it.member].filter(Boolean).join(' / '),sub2=[it.edition,it.format].filter(Boolean).join(' · ');
  const th=it.image?`<div class="thumb"><img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='画像なし'"></div>`:'<div class="thumb">NO IMG</div>';
  return`<div class="card" data-act="open" data-id="${esc(it.id)}">${th}<div class="ct"><b>${esc(it.title||'(無題)')}</b>${sub?`<div class="sub">${esc(sub)}</div>`:''}${sub2?`<div class="sub">${esc(sub2)}</div>`:''}<div class="badges">${badges(it)}</div></div></div>`;
}
function rowItem(it){
  const sub=[it.artist,it.edition].filter(Boolean).join(' · ');
  return`<div class="rowi" data-act="open" data-id="${esc(it.id)}"><span><b>${esc(it.title||'(無題)')}</b>${sub?`<div class="sub">${esc(sub)}</div>`:''}</span><span class="badges" style="margin:0;justify-content:flex-end">${badges(it)}</span></div>`;
}

function viewSettings(){
  const e=canEdit();
  const cats=S.cats.map((c,i)=>`<div class="li" style="cursor:default"><span>${esc(c)}</span>${e?`<button class="dng" data-act="delcat" data-i="${i}">削除</button>`:''}</div>`).join('');
  return`<h2>設定・バックアップ</h2>
  <div class="note"><b>いまの保存場所：このブラウザの中だけ（仮保存）</b><br>他の端末とは共有されず、ブラウザのデータを消すと失われます。こまめにバックアップを取ってください。ログインと共有は次の段階で追加します。</div>
  <h3>編集モードと閲覧モード</h3>
  <div class="box sub" style="padding:12px 14px">右上のボタンで切り替えます。閲覧モードでは追加・編集・削除ができず、誤タップを防げます。これは自分用の誤操作よけです。友達が「見るだけ」になる本物の権限は、ログイン機能を作る段階で追加します。</div>
  <h3>バックアップ</h3>
  <div class="box" style="padding:12px 14px"><div class="row"><button data-act="export">JSONを書き出す</button><button data-act="csv">CSVを書き出す</button></div>
  ${e?`<div class="row" style="margin-top:8px"><button data-act="impmerge">読み込み（追加）</button><button data-act="impreplace">読み込み（置き換え）</button></div><input id="file" type="file" accept=".json,application/json" hidden>`:''}</div>
  ${e?`<h3>「必読」ページの内容</h3><div class="box" style="padding:12px 14px"><textarea id="notice" maxlength="3000" placeholder="友達に見てもらうときの注意書きなど">${esc(S.notice)}</textarea></div>
  <h3>カテゴリを追加</h3><div class="box" style="padding:12px 14px"><div class="bar"><input id="newcat" placeholder="例：ペンライト" maxlength="30"><button class="pri" data-act="addcat" style="flex:none">追加</button></div>${cats}</div>
  <h3>データの削除</h3><div class="box" style="padding:12px 14px"><button class="dng" data-act="wipe" style="width:100%">すべてのデータを削除</button></div>`:''}
  <div style="margin-top:18px"><button data-act="guide" data-i="0">使い方ガイドを見る</button></div>`;
}

function openSheet(h){const p=$('#panel');p.removeAttribute('data-id');p.innerHTML=h;$('#sheet').hidden=false;document.body.style.overflow='hidden';p.scrollTop=0}
function closeSheet(){const p=$('#panel');$('#sheet').hidden=true;document.body.style.overflow='';p.innerHTML='';p.removeAttribute('data-id')}
function closeAny(){if($('#panel').dataset.id)closePage();else closeSheet()}

const GUIDE=[['ようこそ','COLLECT.は、持っているものと探しているものを整理するノートです。'],['ホーム','所持・求め・自分で作ったリストがホームに並びます。リストは自由に作れます。'],['追加と編集','「＋ 新規」を押して、タイトルを入れるだけ。入力は自動で保存されます。'],['保存について','今はこの端末のブラウザの中だけに保存されます。設定からこまめにバックアップを取ってください。']];
function showGuide(i){
  P.seen=true;saveP();
  const g=GUIDE[i],last=i===GUIDE.length-1;
  openSheet(`<h2>${esc(g[0])}</h2><p>${esc(g[1])}</p><div class="dots">${GUIDE.map((_,j)=>`<span class="${j===i?'on':''}"></span>`).join('')}</div><div class="row"><button data-act="close">スキップ</button><button class="pri" data-act="${last?'close':'guide'}" data-i="${i+1}">${last?'はじめる':'次へ'}</button></div>`);
}
function showNotice(){
  openSheet(`<h2>必読</h2><div style="white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:16px">${S.notice?esc(S.notice):'<span class="sub">まだ書かれていません。設定の「必読ページの内容」から書けます。</span>'}</div><button data-act="close" style="width:100%">閉じる</button>`);
}

function openPage(id){
  const it=S.items.find(x=>x.id===id);if(!it)return;
  openSheet(canEdit()?pageEdit(it):pageView(it));
  $('#panel').dataset.id=id;
}
function pageView(it){
  const rows=[['状態',it.status==='owned'?'所持':'求め'],['カテゴリ',[it.category,it.sub].filter(Boolean).join(' / ')],['グループ',it.artist],['メンバー',it.member],['発売日',it.release],['配信・放送日',it.bdate],['版・バージョン',it.edition],['形態',it.format],['数量',it.qty],['コンディション',it.condition],['購入日',it.pdate],['購入価格',it.price?it.price+' 円':''],['購入先',it.store],['リスト',(S.lists.find(l=>l.id===it.listId)||{}).name],['交換の状態',it.trade],['探し状態',it.status==='wanted'?it.want:''],['優先度',it.status==='wanted'?it.prio:''],['タグ',it.tags.join('、')],['収録内容',it.contents],['メモ',it.notes]].filter(r=>r[1]!==''&&r[1]!==undefined&&r[1]!==null);
  return`<div class="ph"><button data-act="close">‹ 閉じる</button></div>
  ${it.image?`<div class="thumb" style="width:100%;height:200px;margin-bottom:10px"><img src="${esc(it.image)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='画像を読み込めません'"></div>`:''}
  <h2>${esc(it.title||'(無題)')}</h2><dl class="dl">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`;
}
function pageEdit(it){
  const cats=allCats();if(it.category&&cats.indexOf(it.category)<0)cats.push(it.category);
  const subs=uniq(S.items.filter(i=>i.category===it.category).map(i=>i.sub)),arts=uniq(S.items.map(i=>i.artist));
  const sel=(k,arr,cur,blank)=>`<select data-k="${k}">${blank!=null?`<option value="">${blank}</option>`:''}${arr.map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
  const inp=(k,v,ex)=>`<input data-k="${k}" value="${esc(v)}" ${ex||''}>`;
  const pr=(l,c)=>`<div class="pr"><div class="pl">${l}</div><div class="pv">${c}</div></div>`;
  return`<div class="ph"><button data-act="close">‹ 閉じる</button><span class="sub">自動で保存されます</span></div>
  ${it.image?`<div class="thumb" style="width:100%;height:160px;margin-bottom:8px"><img src="${esc(it.image)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='画像を読み込めません'"></div>`:''}
  <input class="ptitle" data-k="title" maxlength="200" placeholder="タイトル（無題）" value="${esc(it.title)}">
  ${pr('状態',`<select data-k="status"><option value="owned"${it.status==='owned'?' selected':''}>所持</option><option value="wanted"${it.status==='wanted'?' selected':''}>求め</option></select>`)}
  ${it.status==='wanted'?pr('探し状態',sel('want',WANT.filter(Boolean),it.want,'未設定'))+pr('優先度',sel('prio',PRIO.filter(Boolean),it.prio,'未設定')):''}
  ${pr('カテゴリ',sel('category',cats,it.category,'未選択'))}
  ${pr('サブカテゴリ',inp('sub',it.sub,'list="dl-sub" maxlength="60" placeholder="例：CD円盤"')+`<datalist id="dl-sub">${subs.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`)}
  ${pr('グループ',inp('artist',it.artist,'list="dl-art" maxlength="100"')+`<datalist id="dl-art">${arts.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`)}
  ${pr('メンバー',inp('member',it.member,'maxlength="100"'))}
  ${pr('版・バージョン',inp('edition',it.edition,'maxlength="100" placeholder="初回限定A、店舗特典など"'))}
  ${pr('形態',inp('format',it.format,'maxlength="100" placeholder="CD+DVD など"'))}
  ${pr('発売日',inp('release',it.release,'type="date"'))}
  ${pr('配信・放送日',inp('bdate',it.bdate,'type="date"'))}
  ${pr('数量',inp('qty',it.qty,'type="number" min="0" max="9999" inputmode="numeric"'))}
  ${pr('コンディション',sel('condition',COND.filter(Boolean),it.condition,'未選択'))}
  ${pr('購入日',inp('pdate',it.pdate,'type="date"'))}
  ${pr('購入価格（円）',inp('price',it.price,'inputmode="decimal" maxlength="12"'))}
  ${pr('購入先',inp('store',it.store,'maxlength="100"'))}
  ${pr('リスト',`<select data-k="listId"><option value="">リストなし</option>${S.lists.map(l=>`<option value="${esc(l.id)}"${l.id===it.listId?' selected':''}>${esc(l.name)}</option>`).join('')}</select>`)}
  ${pr('交換の状態',`<select data-k="trade">${TR.map(t=>`<option value="${t}"${t===it.trade?' selected':''}>${t||'交換対象外'}</option>`).join('')}</select>`)}
  ${pr('タグ',inp('tags',it.tags.join(', '),'maxlength="200" placeholder="カンマ区切り"'))}
  ${pr('画像URL',inp('image',it.image,'type="url" maxlength="1000" placeholder="https://..."'))}
  ${pr('収録内容',`<textarea data-k="contents" maxlength="3000" placeholder="1行に1つずつ">${esc(it.contents)}</textarea>`)}
  ${pr('メモ',`<textarea data-k="notes" maxlength="3000">${esc(it.notes)}</textarea>`)}
  <div class="row" style="margin-top:18px"><button data-act="dup">複製</button><button data-act="flip">${it.status==='owned'?'求めへ移動':'所持へ移動'}</button><button class="dng" data-act="del">削除</button></div>`;
}
function setField(k,v){
  if(FIELDS.indexOf(k)<0)return;
  const it=S.items.find(x=>x.id===$('#panel').dataset.id);if(!it)return;
  if(k==='qty')it.qty=Math.max(0,Math.min(9999,parseInt(v,10)||0));
  else if(k==='tags')it.tags=v.split(/[,、，]/).map(t=>t.trim().slice(0,30)).filter(Boolean).slice(0,20);
  else if(k==='price'){const c=v.replace(/[,，円\s]/g,'').slice(0,12);if(c&&isNaN(Number(c))){toast('購入価格は数字で入力してください');return}it.price=c}
  else if(k==='image'){const u=v.trim();it.image=okUrl(u)?u.slice(0,1000):''}
  else if(k==='status')it.status=v==='wanted'?'wanted':'owned';
  else if(k==='trade')it.trade=TR.indexOf(v)>=0?v:'';
  else if(k==='want')it.want=WANT.indexOf(v)>=0?v:'';
  else if(k==='prio')it.prio=PRIO.indexOf(v)>=0?v:'';
  else if(k==='condition')it.condition=COND.indexOf(v)>=0?v:'';
  else if(k==='listId')it.listId=S.lists.some(l=>l.id===v)?v:'';
  else it[k]=String(v).slice(0,(k==='notes'||k==='contents')?3000:300);
  save();
}
function newItem(){
  const p=ui.page;
  const it=fixItem({id:uid(),title:'',status:p==='wanted'?'wanted':'owned',qty:1,listId:p.indexOf('list:')===0?p.slice(5):'',added:Date.now()});
  S.items.push(it);save();ui.fresh=it.id;openPage(it.id);
  const t=$('#panel .ptitle');if(t)setTimeout(()=>t.focus(),50);
}
function closePage(){
  const id=$('#panel').dataset.id,it=S.items.find(x=>x.id===id);
  if(it&&!it.title.trim()){
    if(ui.fresh===id){S.items=S.items.filter(x=>x!==it);toast('タイトルが空だったので破棄しました')}
    else it.title='(無題)';
    save();
  }
  ui.fresh='';closeSheet();render();
}

function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const stamp=()=>new Date().toISOString().slice(0,10);
function doExport(){download('collect-backup-'+stamp()+'.json',JSON.stringify({app:'COLLECT',version:2,exported:new Date().toISOString(),items:S.items,lists:S.lists,cats:S.cats,notice:S.notice},null,2),'application/json');toast('バックアップを書き出しました')}
function doCsv(){
  const cols=[['title','タイトル'],['status','状態'],['category','カテゴリ'],['sub','サブカテゴリ'],['artist','グループ'],['member','メンバー'],['release','発売日'],['bdate','配信・放送日'],['edition','版'],['format','形態'],['qty','数量'],['condition','コンディション'],['pdate','購入日'],['price','購入価格'],['store','購入先'],['trade','交換の状態'],['want','探し状態'],['prio','優先度'],['tags','タグ'],['contents','収録内容'],['notes','メモ']];
  const cell=v=>{let s=Array.isArray(v)?v.join(' '):String(v==null?'':v);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
  const lines=[cols.map(c=>cell(c[1])).join(',')].concat(S.items.map(i=>cols.map(c=>cell(c[0]==='status'?(i.status==='owned'?'所持':'求め'):i[c[0]])).join(',')));
  download('collect-'+stamp()+'.csv','\ufeff'+lines.join('\r\n'),'text/csv');toast('CSVを書き出しました');
}
function doImport(file){
  const rd=new FileReader();
  rd.onerror=()=>toast('ファイルを読み込めませんでした');
  rd.onload=()=>{
    let r;try{r=JSON.parse(rd.result)}catch(e){toast('JSONとして読み込めません。データは変更していません');return}
    if(!r||!Array.isArray(r.items)){toast('COLLECT.のバックアップではないようです。データは変更していません');return}
    const n=norm(r);
    if(importMode==='replace'){
      if(!confirm('現在のデータをすべて消して、'+n.items.length+'件に置き換えます。よろしいですか？\n（直前のデータは1つ前の状態としてブラウザ内に残します）'))return;
      try{localStorage.setItem(PREV,JSON.stringify(S))}catch(e){}
      S=n;
    }else{
      if(!confirm(n.items.length+'件を現在のデータに追加します。同じIDのアイテムは重複させません。よろしいですか？'))return;
      try{localStorage.setItem(PREV,JSON.stringify(S))}catch(e){}
      const ids=new Set(S.items.map(i=>i.id));let add=0;
      n.items.forEach(i=>{if(!ids.has(i.id)){S.items.push(i);add++}});
      n.lists.forEach(l=>{if(!S.lists.some(x=>x.id===l.id))S.lists.push(l)});
      S.cats=uniq(S.cats.concat(n.cats));
      if(!S.notice&&n.notice)S.notice=n.notice;
      toast(add+'件を追加しました');
    }
    save();render();
  };
  rd.readAsText(file);
}
function addList(){const el=$('#newlist');const n=(el&&el.value||'').trim().slice(0,40);if(!n){toast('リスト名を入力してください');return}S.lists.push({id:uid(),name:n});save();render();toast('リストを作りました')}
function addCat(){const el=$('#newcat');const n=(el&&el.value||'').trim().slice(0,30);if(!n)return;if(allCats().indexOf(n)>=0){toast('すでにあります');return}S.cats.push(n);save();render()}

document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeAny();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='go')go(b.dataset.p);
  else if(a==='mode'){P.mode=canEdit()?'view':'edit';saveP();render();toast(canEdit()?'編集モードにしました':'閲覧モードにしました（編集できません）')}
  else if(a==='view'){P.view=b.dataset.v;saveP();render()}
  else if(a==='chip'){ui[b.dataset.k]=b.dataset.v;if(b.dataset.k==='cat')ui.sub='';render()}
  else if(a==='resetf'){ui.q='';ui.cat=ui.sub=ui.year=ui.artist=ui.tag=ui.trade=ui.want=ui.prio='';render()}
  else if(a==='new'){if(canEdit())newItem()}
  else if(a==='open')openPage(id);
  else if(a==='close')closeAny();
  else if(a==='notice')showNotice();
  else if(a==='guide')showGuide(+b.dataset.i||0);
  else if(a==='dup'){const cur=S.items.find(x=>x.id===$('#panel').dataset.id);if(cur){const c=fixItem(Object.assign({},cur,{id:uid(),added:Date.now(),title:cur.title+'（コピー）'}));S.items.push(c);save();render();openPage(c.id);toast('複製しました')}}
  else if(a==='flip'){const pid=$('#panel').dataset.id,cur=S.items.find(x=>x.id===pid);if(cur){cur.status=cur.status==='owned'?'wanted':'owned';save();openPage(pid);toast('移動しました')}}
  else if(a==='del'){const pid=$('#panel').dataset.id,cur=S.items.find(x=>x.id===pid);if(cur&&confirm('「'+(cur.title||'(無題)')+'」を削除します。元に戻せません。よろしいですか？')){S.items=S.items.filter(x=>x!==cur);save();ui.fresh='';closeSheet();render();toast('削除しました')}}
  else if(a==='addlist')addList();
  else if(a==='dellist'){const l=S.lists.find(x=>x.id===id);if(l&&confirm('リスト「'+l.name+'」を削除します。中のアイテムは消えず「リストなし」になります。よろしいですか？')){S.lists=S.lists.filter(x=>x.id!==id);S.items.forEach(i=>{if(i.listId===id)i.listId=''});save();go('home');toast('リストを削除しました')}}
  else if(a==='addcat')addCat();
  else if(a==='delcat'){const c=S.cats[+b.dataset.i];if(c&&confirm('カテゴリ「'+c+'」を一覧から削除します。このカテゴリのアイテムは消えません。')){S.cats.splice(+b.dataset.i,1);save();render()}}
  else if(a==='export')doExport();
  else if(a==='csv')doCsv();
  else if(a==='impmerge'||a==='impreplace'){importMode=a==='impmerge'?'merge':'replace';const f=$('#file');if(f)f.click()}
  else if(a==='wipe'){if(confirm('すべてのデータを削除します。元に戻せません。先にバックアップを取りましたか？')&&confirm('本当に削除しますか？')){try{localStorage.setItem(PREV,JSON.stringify(S))}catch(e){}S={items:[],lists:[],cats:[],notice:''};save();render();toast('削除しました')}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;renderCards();return}
  if(t.dataset&&t.dataset.k&&t.closest('#panel')&&t.tagName!=='SELECT')setField(t.dataset.k,t.value);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){ui[t.dataset.f]=t.value;renderCards();return}
  if(t.dataset&&t.dataset.k&&t.closest('#panel')&&t.tagName==='SELECT'){
    const pid=$('#panel').dataset.id;setField(t.dataset.k,t.value);
    if(t.dataset.k==='status'||t.dataset.k==='category')openPage(pid);
    return;
  }
  if(t.id==='lname'){const l=S.lists.find(x=>'list:'+x.id===ui.page);const n=t.value.trim().slice(0,40);if(l&&n){l.name=n;save()}else if(l){t.value=l.name}return}
  if(t.id==='notice'){S.notice=t.value.slice(0,3000);save();toast('必読ページを保存しました');return}
  if(t.id==='file'&&t.files&&t.files[0]){doImport(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='newlist'){e.preventDefault();addList()}
  else if(e.target.id==='newcat'){e.preventDefault();addCat()}
});
render();
if(!P.seen)showGuide(0);
</script>
</body>
</html>
