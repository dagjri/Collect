<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLLECT.</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--ink:#1f1f1f;--sub:#777;--line:#e8e8e6;--soft:#f1f1ef;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1c1c1c;--ink:#eee;--sub:#9a9a9a;--line:#2c2c2c;--soft:#242424;--danger:#ff8a80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.55;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hl{display:flex;align-items:center;gap:8px;min-width:0}
#title{margin:0;font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#title.brand{letter-spacing:.18em}
#back{min-height:38px;width:38px;padding:0;font-size:22px;flex:none}
#mode{min-height:34px;padding:0 12px;font-size:13px;border-radius:999px;color:var(--sub);flex:none}
#mode.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:4px 0 14px}
h3{font-size:13px;color:var(--sub);margin:22px 0 8px;font-weight:600;letter-spacing:.08em}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 4px}
button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.dng{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.bar{display:flex;gap:8px;margin-bottom:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:-4px -16px 12px;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:0;background:transparent;color:var(--sub);min-height:44px;padding:0 12px;box-shadow:inset 0 -2px 0 transparent}
.tab.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;min-height:34px;padding:0 14px;border-radius:999px;font-size:14px;color:var(--sub)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:2px 0 10px;gap:8px}
.meta select{width:auto;min-height:34px;padding:2px 8px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ct b{overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.bd{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--sub);white-space:nowrap}
.bd.k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;color:var(--sub);padding:44px 16px;border:1px dashed var(--line);border-radius:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-bottom:10px}
.box.accent{border-color:var(--ink)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li b{font-weight:600}
.note{font-size:13px;color:var(--sub);background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
#fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:28px;padding:0;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:18px}}
.dl{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;font-size:15px;margin:14px 0}
.dl dt{color:var(--sub);font-size:13px}.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.lines{background:var(--soft);border-radius:12px;padding:4px 14px;margin:6px 0 14px}
.lines div{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.lines div:last-child{border-bottom:0}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
details.more summary{cursor:pointer;color:var(--sub);min-height:44px;display:flex;align-items:center}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hl"><button id="back" data-act="go" data-p="home" hidden aria-label="戻る">‹</button><h1 id="title" class="brand">COLLECT.</h1></div>
  <button id="mode" data-act="mode">編集モード</button>
</header>
<main id="main"></main>
<button id="fab" data-act="new" aria-label="追加">＋</button>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
const APP='COLLECT.';
const KEY='collect_v1',PREV='collect_v1_prev',PK='collect_prefs';
const OWN='owned0',WNT='wanted0';
const CATS=['CD','DVD/Blu-ray','グッズ','写真','トレカ','雑誌','書籍','ライブ映像','TV録画','その他'];
const TR=['交換可','相談中','取り置き','成立','キャンセル','交換不可'];
const WANT=['探し中','取引中'];
const PRIO=['高','中','低'];
const COND=['新品・未開封','美品','良好','傷あり','難あり'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const okUrl=u=>/^https?:\/\//i.test(u||'');
const uniq=a=>Array.from(new Set(a.filter(Boolean)));
document.title=APP;

let P={mode:'edit',seen:false};
try{Object.assign(P,JSON.parse(localStorage.getItem(PK))||{})}catch(e){}
const saveP=()=>{try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}};
const canEdit=()=>P.mode==='edit';

function fixItem(x){
  const s=(k,n)=>String(x[k]==null?'':x[k]).slice(0,n||300);
  return{id:s('id',60)||uid(),title:s('title'),status:x.status==='wanted'?'wanted':'owned',listId:s('listId',60),category:s('category',60),sub:s('sub',60),artist:s('artist'),member:s('member'),release:s('release',20)||s('bdate',20),edition:s('edition'),format:s('format'),qty:Math.max(0,parseInt(x.qty,10)||0),condition:s('condition',40),pdate:s('pdate',20),price:s('price',30),store:s('store'),notes:s('notes',3000),contents:s('contents',3000),image:okUrl(x.image)?s('image',1000):'',tags:(Array.isArray(x.tags)?x.tags:[]).map(t=>String(t).trim().slice(0,30)).filter(Boolean).slice(0,20),trade:TR.indexOf(x.trade)>=0?x.trade:'',want:WANT.indexOf(x.want)>=0?x.want:'',prio:PRIO.indexOf(x.prio)>=0?x.prio:'',added:Number(x.added)||Date.now()};
}
function norm(r){
  const lists=(Array.isArray(r.lists)?r.lists:[]).filter(l=>l&&l.id&&l.name).map(l=>({id:String(l.id).slice(0,60),name:String(l.name).slice(0,40),type:l.type==='wanted'?'wanted':l.type==='owned'?'owned':''}));
  const items=(Array.isArray(r.items)?r.items:[]).filter(x=>x&&typeof x==='object').map(fixItem);
  if(!lists.some(l=>l.id===OWN))lists.unshift({id:OWN,name:'所持リスト',type:'owned'});
  if(!lists.some(l=>l.id===WNT))lists.splice(1,0,{id:WNT,name:'求めリスト',type:'wanted'});
  lists.forEach(l=>{if(l.id===OWN)l.type='owned';else if(l.id===WNT)l.type='wanted';else if(!l.type){const its=items.filter(i=>i.listId===l.id);l.type=its.length&&its.every(i=>i.status==='wanted')?'wanted':'owned'}});
  items.forEach(i=>{let l=lists.find(x=>x.id===i.listId);if(!l){l=lists.find(x=>x.id===(i.status==='wanted'?WNT:OWN));i.listId=l.id}i.status=l.type});
  return{items:items,lists:lists,cats:(Array.isArray(r.cats)?r.cats:[]).map(c=>String(c).slice(0,30)).filter(Boolean),notice:String(r.notice||'').slice(0,3000)};
}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.items))return norm(r)}catch(e){}return norm({})}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('保存に失敗しました。端末の空き容量を確認してください');return false}}
const UI0={page:'home',q:'',cat:'',sub:'',year:'',st:'',sort:'added'};
let ui=Object.assign({},UI0);
let importMode='merge',curId='';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
const allCats=()=>CATS.concat(S.cats.filter(c=>CATS.indexOf(c)<0));
const yearOf=i=>(i.release||'').slice(0,4);
const curList=()=>ui.page.indexOf('list:')===0?S.lists.find(l=>l.id===ui.page.slice(5)):null;
const listItems=l=>S.items.filter(i=>i.listId===l.id);
function go(p){ui=Object.assign({},UI0,{page:p,sort:ui.sort});render();window.scrollTo(0,0)}
function resetFilters(){ui.q='';ui.cat=ui.sub=ui.year=ui.st=''}

function render(){
  let p=ui.page,l=curList();
  if(p.indexOf('list:')===0&&!l){ui.page=p='home'}
  $('#back').hidden=p==='home';
  const t=$('#title');t.textContent=p==='home'?APP:(p==='settings'?'設定・バックアップ':l.name);t.className=p==='home'?'brand':'';
  const m=$('#mode');m.textContent=canEdit()?'編集モード':'閲覧モード';m.classList.toggle('on',canEdit());
  $('#fab').style.display=(canEdit()&&l)?'block':'none';
  const main=$('#main');
  if(p==='home')main.innerHTML=viewHome();
  else if(p==='settings')main.innerHTML=viewSettings();
  else{main.innerHTML=viewList(l);renderCards()}
}

function viewHome(){
  const rows=S.lists.map(l=>`<div class="li" data-act="go" data-p="list:${esc(l.id)}"><span><b>${esc(l.name)}</b><div class="sub">${l.type==='wanted'?'求め':'所持'} ・ ${listItems(l).length}件</div></span><span class="sub">›</span></div>`).join('');
  return`<div class="box accent"><div class="li" data-act="notice"><span><b>必読</b></span><span class="sub">›</span></div></div>
  <h3>リスト</h3><div class="box">${rows}</div>
  ${canEdit()?`<div class="note">自分でリストを増やせます（例：所持リスト②、ライブ別）。</div>
  <div class="bar"><input id="newlist" maxlength="40" placeholder="新しいリスト名"><select id="newtype" style="width:96px;flex:none"><option value="owned">所持</option><option value="wanted">求め</option></select></div>
  <button class="pri" data-act="addlist" style="width:100%">＋ リストを作る</button>`:''}
  <h3>その他</h3><div class="box"><div class="li" data-act="go" data-p="settings"><span><b>設定・バックアップ</b></span><span class="sub">›</span></div><div class="li" data-act="guide" data-i="0"><span><b>使い方</b></span><span class="sub">›</span></div></div>`;
}

function chips(arr,cur,key,all){
  return`<div class="chips"><button class="chip${cur?'':' on'}" data-act="chip" data-k="${key}" data-v="">${all}</button>${arr.map(x=>`<button class="chip${x===cur?' on':''}" data-act="chip" data-k="${key}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
}
function viewList(l){
  const base=listItems(l),w=l.type==='wanted';
  const cats=uniq(base.map(i=>i.category)),subs=ui.cat?uniq(base.filter(i=>i.category===ui.cat).map(i=>i.sub)):[],years=uniq(base.map(yearOf)).sort();
  const sorts=[['added','追加が新しい順'],['title','タイトル順'],['release','日付が新しい順'],['artist','グループ順']];
  if(w)sorts.push(['prio','優先度順']);
  const isDef=l.id===OWN||l.id===WNT;
  return`<div class="tabs"><button class="tab${ui.cat?'':' on'}" data-act="chip" data-k="cat" data-v="">すべて</button>${cats.map(c=>`<button class="tab${c===ui.cat?' on':''}" data-act="chip" data-k="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${subs.length?chips(subs,ui.sub,'sub','すべて'):''}
  <div class="bar"><input id="q" type="search" placeholder="タイトル・出演者・メモで検索" value="${esc(ui.q)}"></div>
  <div class="meta"><span id="res"></span><select data-f="sort">${sorts.map(a=>`<option value="${a[0]}"${ui.sort===a[0]?' selected':''}>${a[1]}</option>`).join('')}</select></div>
  ${years.length>1?chips(years,ui.year,'year','全年'):''}
  ${chips(w?WANT:TR,ui.st,'st','すべて')}
  <div id="cards"></div>
  ${canEdit()?`<h3>このリストの設定</h3><div class="box" style="padding:12px 14px"><label style="margin-top:0">リスト名</label><input id="lname" maxlength="40" value="${esc(l.name)}">${isDef?'':`<button class="dng" data-act="dellist" data-id="${esc(l.id)}" style="width:100%;margin-top:12px">このリストを削除</button>`}</div>`:''}`;
}
function match(it,w){
  const q=ui.q.trim().toLowerCase();
  if(q){const h=[it.title,it.artist,it.member,it.edition,it.format,it.store,it.notes,it.contents,it.category,it.sub].concat(it.tags).join(' ').toLowerCase();
    if(!q.split(/\s+/).every(x=>h.indexOf(x)>=0))return false}
  if(ui.cat&&it.category!==ui.cat)return false;
  if(ui.sub&&it.sub!==ui.sub)return false;
  if(ui.year&&yearOf(it)!==ui.year)return false;
  if(ui.st&&(w?it.want:it.trade)!==ui.st)return false;
  return true;
}
function sorter(){
  const c=(a,b)=>String(a).localeCompare(String(b),'ja');
  if(ui.sort==='title')return(a,b)=>c(a.title,b.title);
  if(ui.sort==='release')return(a,b)=>c(b.release,a.release);
  if(ui.sort==='artist')return(a,b)=>c(a.artist,b.artist)||c(a.title,b.title);
  if(ui.sort==='prio'){const o={'高':0,'中':1,'低':2,'':3};return(a,b)=>o[a.prio]-o[b.prio]}
  return(a,b)=>b.added-a.added;
}
function renderCards(){
  const l=curList();if(!l)return;
  const w=l.type==='wanted',base=listItems(l),list=base.filter(i=>match(i,w)).sort(sorter());
  $('#res').textContent=list.length+'件';
  let h='';
  if(!list.length){
    h=base.length?'<div class="empty">条件に合うアイテムがありません。<br>検索や絞り込みを変えてみてください。</div>'
      :'<div class="empty">まだアイテムがありません。<br>'+(canEdit()?'右下の「＋」から最初の1件を追加しましょう。':'編集モードに切り替えると追加できます。')+'</div>';
  }else h=list.map(i=>card(i,w)).join('');
  $('#cards').innerHTML=h;
}
function card(it,w){
  const badge=w?(it.prio?`<span class="bd k">優先度: ${esc(it.prio)}</span>`:''):(it.trade?`<span class="bd k">${esc(it.trade)}</span>`:'');
  const tags=[it.category,it.sub,it.artist,it.member].filter(Boolean).map(t=>`<span class="bd">${esc(t)}</span>`).join('')+(w&&it.want?`<span class="bd">${esc(it.want)}</span>`:'');
  return`<div class="card" data-act="open" data-id="${esc(it.id)}"><div class="ct"><b>${esc(it.title||'(無題)')}</b>${badge}</div>${tags?`<div class="badges">${tags}</div>`:''}${it.notes?`<div class="sub clamp">✎ ${esc(it.notes)}</div>`:''}</div>`;
}

function viewSettings(){
  const e=canEdit();
  const cats=S.cats.map((c,i)=>`<div class="li" style="cursor:default"><span>${esc(c)}</span>${e?`<button class="dng" data-act="delcat" data-i="${i}">削除</button>`:''}</div>`).join('');
  return`<div class="note"><b>いまの保存場所：このブラウザの中だけ（仮保存）</b><br>他の端末とは共有されず、ブラウザのデータを消すと失われます。こまめにバックアップを取ってください。ログインと共有は次の段階で追加します。</div>
  <h3>編集モードと閲覧モード</h3>
  <div class="box sub" style="padding:12px 14px">右上のボタンで切り替えます。閲覧モードでは追加・編集・削除ができず、誤タップを防げます。これは自分用の誤操作よけです。友達が「見るだけ」になる本物の権限は、ログイン機能を作る段階で追加します。</div>
  <h3>バックアップ</h3>
  <div class="box" style="padding:12px 14px"><div class="row"><button data-act="export">JSONを書き出す</button><button data-act="csv">CSVを書き出す</button></div>
  ${e?`<div class="row" style="margin-top:8px"><button data-act="impmerge">読み込み（追加）</button><button data-act="impreplace">読み込み（置き換え）</button></div><input id="file" type="file" accept=".json,application/json" hidden>`:''}</div>
  ${e?`<h3>「必読」ページの内容</h3><div class="box" style="padding:12px 14px"><textarea id="notice" maxlength="3000" placeholder="友達に見てもらうときの注意書きなど">${esc(S.notice)}</textarea></div>
  <h3>カテゴリを追加</h3><div class="box" style="padding:12px 14px"><div class="bar"><input id="newcat" placeholder="例：ペンライト" maxlength="30"><button class="pri" data-act="addcat" style="flex:none">追加</button></div>${cats}</div>
  <h3>データの削除</h3><div class="box" style="padding:12px 14px"><button class="dng" data-act="wipe" style="width:100%">すべてのデータを削除</button></div>`:''}`;
}

function openSheet(h){const p=$('#panel');p.innerHTML=h;$('#sheet').hidden=false;document.body.style.overflow='hidden';p.scrollTop=0}
function closeSheet(){$('#sheet').hidden=true;document.body.style.overflow='';$('#panel').innerHTML='';curId=''}

const GUIDE=[['ようこそ','COLLECT.は、持っているものと探しているものを整理するノートです。'],['リストを開く','ホームのリストをタップすると、中身が見られます。リストは自分で増やせます。'],['追加するには','リストの右下の「＋」を押して、タイトルを入れて「保存」。カードをタップすると詳細が開きます。'],['保存について','今はこの端末のブラウザの中だけに保存されます。設定からこまめにバックアップを取ってください。']];
function showGuide(i){
  P.seen=true;saveP();
  const g=GUIDE[i],last=i===GUIDE.length-1;
  openSheet(`<h2>${esc(g[0])}</h2><p>${esc(g[1])}</p><div class="dots">${GUIDE.map((_,j)=>`<span class="${j===i?'on':''}"></span>`).join('')}</div><div class="row"><button data-act="close">スキップ</button><button class="pri" data-act="${last?'close':'guide'}" data-i="${i+1}">${last?'はじめる':'次へ'}</button></div>`);
}
function showNotice(){
  openSheet(`<h2>必読</h2><div style="white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:16px">${S.notice?esc(S.notice):'<span class="sub">まだ書かれていません。設定の「必読ページの内容」から書けます。</span>'}</div><button data-act="close" style="width:100%">閉じる</button>`);
}

function showDetail(id){
  const it=S.items.find(x=>x.id===id);if(!it)return;
  const l=S.lists.find(x=>x.id===it.listId)||{name:'',type:'owned'};
  curId=id;
  const rows=[['リスト',l.name],['カテゴリ',[it.category,it.sub].filter(Boolean).join(' / ')],['グループ',it.artist],['メンバー',it.member],['日付',it.release],['版・形態',[it.edition,it.format].filter(Boolean).join(' / ')],['数量',it.qty>1?it.qty:''],['コンディション',it.condition],['購入日',it.pdate],['購入価格',it.price?it.price+' 円':''],['購入先',it.store],['タグ',it.tags.join('、')]].filter(r=>r[1]!=='');
  const lines=it.contents.split('\n').map(x=>x.trim()).filter(Boolean);
  openSheet(`${it.image?`<div style="margin-bottom:12px"><img src="${esc(it.image)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px" referrerpolicy="no-referrer" onerror="this.remove()"></div>`:''}
  <h2 style="margin-bottom:8px">${esc(it.title||'(無題)')}</h2>
  <div class="badges" style="margin:0 0 6px">${it.status==='wanted'?(it.want?`<span class="bd">${esc(it.want)}</span>`:'')+(it.prio?`<span class="bd k">優先度: ${esc(it.prio)}</span>`:''):(it.trade?`<span class="bd k">${esc(it.trade)}</span>`:'')}</div>
  <dl class="dl">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
  ${lines.length?`<h3 style="margin-top:6px">収録内容</h3><div class="lines">${lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:''}
  ${it.notes?`<h3 style="margin-top:6px">メモ</h3><div style="white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:14px">${esc(it.notes)}</div>`:''}
  ${canEdit()?`<div class="row"><button class="pri" data-act="edit" data-id="${esc(id)}">編集</button><button data-act="dup" data-id="${esc(id)}">複製</button><button class="dng" data-act="del" data-id="${esc(id)}">削除</button></div>`:''}
  <button data-act="close" style="width:100%;margin-top:8px">閉じる</button>`);
}

function showForm(id){
  const old=id?S.items.find(x=>x.id===id):null;
  const l=old?S.lists.find(x=>x.id===old.listId):(curList()||S.lists[0]);
  const v=old||Object.assign(fixItem({qty:1,listId:l.id}),{id:''});
  const w=l.type==='wanted';
  const cats=allCats();if(v.category&&cats.indexOf(v.category)<0)cats.push(v.category);
  const subs=uniq(S.items.filter(i=>i.listId===l.id).map(i=>i.sub));
  const opts=(arr,cur,blank)=>`<option value="">${blank}</option>`+arr.map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');
  const dt=(f)=>`<datalist id="${f}">${(f==='dl-sub'?subs:uniq(S.items.map(i=>i.artist))).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  openSheet(`<h2>${old?'アイテムを編集':'アイテムを追加'}</h2><form id="f" autocomplete="off">
  <label style="margin-top:0">タイトル（必須）</label><input name="title" required maxlength="200" value="${esc(v.title)}">
  <div class="row"><div><label>カテゴリ</label><select name="category">${opts(cats,v.category,'未選択')}</select></div><div><label>サブカテゴリ</label><input name="sub" list="dl-sub" maxlength="60" placeholder="例：CD円盤" value="${esc(v.sub)}">${dt('dl-sub')}</div></div>
  <div class="row"><div><label>グループ・出演者</label><input name="artist" list="dl-art" maxlength="100" value="${esc(v.artist)}">${dt('dl-art')}</div><div><label>メンバー</label><input name="member" maxlength="100" value="${esc(v.member)}"></div></div>
  <div class="row"><div><label>日付（発売・放送など）</label><input type="date" name="release" value="${esc(v.release)}"></div><div><label>版・バージョン</label><input name="edition" maxlength="100" placeholder="初回限定Aなど" value="${esc(v.edition)}"></div></div>
  ${w?`<div class="row"><div><label>探し状態</label><select name="want">${opts(WANT,v.want,'未設定')}</select></div><div><label>優先度</label><select name="prio">${opts(PRIO,v.prio,'未設定')}</select></div></div>`:`<label>交換の状態</label><select name="trade">${opts(TR,v.trade,'交換対象外')}</select>`}
  <label>収録内容（1行に1つ）</label><textarea name="contents" maxlength="3000">${esc(v.contents)}</textarea>
  <label>メモ</label><textarea name="notes" maxlength="3000">${esc(v.notes)}</textarea>
  <details class="more"><summary>もっと詳しく入力する</summary>
   <div class="row"><div><label>形態</label><input name="format" maxlength="100" placeholder="CD+DVDなど" value="${esc(v.format)}"></div><div><label>数量</label><input name="qty" type="number" min="0" max="9999" inputmode="numeric" value="${esc(v.qty)}"></div></div>
   <div class="row"><div><label>コンディション</label><select name="condition">${opts(COND,v.condition,'未選択')}</select></div><div><label>購入日</label><input type="date" name="pdate" value="${esc(v.pdate)}"></div></div>
   <div class="row"><div><label>購入価格（円）</label><input name="price" inputmode="decimal" maxlength="12" value="${esc(v.price)}"></div><div><label>購入先</label><input name="store" maxlength="100" value="${esc(v.store)}"></div></div>
   <label>タグ（カンマ区切り）</label><input name="tags" maxlength="200" value="${esc(v.tags.join(', '))}">
   <label>画像URL（https://から）</label><input name="image" type="url" maxlength="1000" value="${esc(v.image)}">
   <label>入れるリスト</label><select name="listId">${S.lists.map(x=>`<option value="${esc(x.id)}"${x.id===l.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
  </details>
  <input type="hidden" name="id" value="${esc(v.id)}">
  <div class="row" style="margin-top:18px"><button type="button" data-act="close">キャンセル</button><button class="pri" type="submit">保存</button></div></form>`);
}
function submitForm(f){
  const d=new FormData(f),has=k=>d.has(k),g=k=>String(d.get(k)||'').trim();
  if(!g('title')){toast('タイトルを入力してください');return}
  const img=g('image');if(img&&!okUrl(img)){toast('画像URLは http:// か https:// から始めてください');return}
  const price=g('price').replace(/[,，円\s]/g,'');if(price&&isNaN(Number(price))){toast('購入価格は数字で入力してください');return}
  const old=g('id')?S.items.find(x=>x.id===g('id')):null;
  const pick=k=>has(k)?g(k):(old?old[k]:'');
  const l=S.lists.find(x=>x.id===g('listId'))||S.lists[0];
  const it=fixItem({id:old?old.id:uid(),added:old?old.added:Date.now(),title:g('title'),status:l.type,listId:l.id,category:g('category'),sub:g('sub'),artist:g('artist'),member:g('member'),release:g('release'),edition:g('edition'),format:g('format'),qty:g('qty'),condition:g('condition'),pdate:g('pdate'),price:price,store:g('store'),notes:g('notes'),contents:g('contents'),image:img,tags:g('tags').split(/[,、，]/),trade:pick('trade'),want:pick('want'),prio:pick('prio')});
  if(old)S.items[S.items.indexOf(old)]=it;else{S.items.push(it);resetFilters()}
  if(!save())return;
  closeSheet();render();toast('保存しました');
}

function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const stamp=()=>new Date().toISOString().slice(0,10);
function doExport(){download('collect-backup-'+stamp()+'.json',JSON.stringify({app:'COLLECT',version:3,exported:new Date().toISOString(),items:S.items,lists:S.lists,cats:S.cats,notice:S.notice},null,2),'application/json');toast('バックアップを書き出しました')}
function doCsv(){
  const cols=[['title','タイトル'],['list','リスト'],['category','カテゴリ'],['sub','サブカテゴリ'],['artist','グループ'],['member','メンバー'],['release','日付'],['edition','版'],['format','形態'],['qty','数量'],['condition','コンディション'],['pdate','購入日'],['price','購入価格'],['store','購入先'],['trade','交換の状態'],['want','探し状態'],['prio','優先度'],['tags','タグ'],['contents','収録内容'],['notes','メモ']];
  const cell=v=>{let s=Array.isArray(v)?v.join(' '):String(v==null?'':v);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
  const val=(i,k)=>k==='list'?((S.lists.find(l=>l.id===i.listId)||{}).name||''):i[k];
  const lines=[cols.map(c=>cell(c[1])).join(',')].concat(S.items.map(i=>cols.map(c=>cell(val(i,c[0]))).join(',')));
  download('collect-'+stamp()+'.csv','\ufeff'+lines.join('\r\n'),'text/csv');toast('CSVを書き出しました');
}
function doImport(file){
  const rd=new FileReader();
  rd.onerror=()=>toast('ファイルを読み込めませんでした');
  rd.onload=()=>{
    let r;try{r=JSON.parse(rd.result)}catch(e){toast('JSONとして読み込めません。データは変更していません');return}
    if(!r||!Array.isArray(r.items)){toast('COLLECT.のバックアップではないようです。データは変更していません');return}
    const n=norm(r);
    if(importMode==='replace'){
      if(!confirm('現在のデータをすべて消して、'+n.items.length+'件に置き換えます。よろしいですか？\n（直前のデータは1つ前の状態としてブラウザ内に残します）'))return;
      try{localStorage.setItem(PREV,JSON.stringify(S))}catch(e){}
      S=n;
    }else{
      if(!confirm(n.items.length+'件を現在のデータに追加します。同じIDのアイテムは重複させません。よろしいですか？'))return;
      try{localStorage.setItem(PREV,JSON.stringify(S))}catch(e){}
      const ids=new Set(S.items.map(i=>i.id));let add=0;
      n.lists.forEach(l=>{if(!S.lists.some(x=>x.id===l.id))S.lists.push(l)});
      n.items.forEach(i=>{if(!ids.has(i.id)){S.items.push(i);add++}});
      S.cats=uniq(S.cats.concat(n.cats));
      if(!S.notice&&n.notice)S.notice=n.notice;
      toast(add+'件を追加しました');
    }
    save();render();
  };
  rd.readAsText(file);
}
function addList(){
  const el=$('#newlist'),n=(el&&el.value||'').trim().slice(0,40);
  if(!n){toast('リスト名を入力してください');return}
  S.lists.push({id:uid(),name:n,type:$('#newtype').value==='wanted'?'wanted':'owned'});save();render();toast('リストを作りました');
}
function addCat(){const el=$('#newcat'),n=(el&&el.value||'').trim().slice(0,30);if(!n)return;if(allCats().indexOf(n)>=0){toast('すでにあります');return}S.cats.push(n);save();render()}

document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='go')go(b.dataset.p);
  else if(a==='mode'){P.mode=canEdit()?'view':'edit';saveP();render();toast(canEdit()?'編集モードにしました':'閲覧モードにしました（編集できません）')}
  else if(a==='chip'){ui[b.dataset.k]=b.dataset.v;if(b.dataset.k==='cat')ui.sub='';render()}
  else if(a==='new'){if(canEdit())showForm(null)}
  else if(a==='open')showDetail(id);
  else if(a==='edit'){if(canEdit())showForm(id)}
  else if(a==='close')closeSheet();
  else if(a==='notice')showNotice();
  else if(a==='guide')showGuide(+b.dataset.i||0);
  else if(a==='dup'){const cur=S.items.find(x=>x.id===id);if(cur&&canEdit()){const c=fixItem(Object.assign({},cur,{id:uid(),added:Date.now(),title:cur.title+'（コピー）'}));S.items.push(c);save();render();showDetail(c.id);toast('複製しました')}}
  else if(a==='del'){const cur=S.items.find(x=>x.id===id);if(cur&&canEdit()&&confirm('「'+(cur.title||'(無題)')+'」を削除します。元に戻せません。よろしいですか？')){S.items=S.items.filter(x=>x!==cur);save();closeSheet();render();toast('削除しました')}}
  else if(a==='addlist')addList();
  else if(a==='dellist'){const l=S.lists.find(x=>x.id===id);if(l&&confirm('リスト「'+l.name+'」を削除します。\n中のアイテム '+listItems(l).length+' 件も一緒に削除されます。元に戻せません。よろしいですか？')){S.items=S.items.filter(i=>i.listId!==id);S.lists=S.lists.filter(x=>x.id!==id);save();go('home');toast('リストを削除しました')}}
  else if(a==='addcat')addCat();
  else if(a==='delcat'){const c=S.cats[+b.dataset.i];if(c&&confirm('カテゴリ「'+c+'」を一覧から削除します。このカテゴリのアイテムは消えません。')){S.cats.splice(+b.dataset.i,1);save();render()}}
  else if(a==='export')doExport();
  else if(a==='csv')doCsv();
  else if(a==='impmerge'||a==='impreplace'){importMode=a==='impmerge'?'merge':'replace';const f=$('#file');if(f)f.click()}
  else if(a==='wipe'){if(confirm('すべてのデータを削除します。元に戻せません。先にバックアップを取りましたか？')&&confirm('本当に削除しますか？')){try{localStorage.setItem(PREV,JSON.stringify(S))}catch(e){}S=norm({});save();go('home');toast('削除しました')}}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;renderCards()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){ui[t.dataset.f]=t.value;renderCards();return}
  if(t.id==='lname'){const l=curList(),n=t.value.trim().slice(0,40);if(l&&n){l.name=n;save();$('#title').textContent=n;toast('名前を変更しました')}else if(l){t.value=l.name}return}
  if(t.id==='notice'){S.notice=t.value.slice(0,3000);save();toast('必読ページを保存しました');return}
  if(t.id==='file'&&t.files&&t.files[0]){doImport(t.files[0]);t.value=''}
});
document.addEventListener('submit',e=>{if(e.target.id==='f'){e.preventDefault();submitForm(e.target)}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='newlist'){e.preventDefault();addList()}
  else if(e.target.id==='newcat'){e.preventDefault();addCat()}
});
render();
if(!P.seen)showGuide(0);
</script>
</body>
</html>
